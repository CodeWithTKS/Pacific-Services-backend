<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

    <h2>Razorpay Payment Test</h2>
    <button id="pay-btn">Pay Now</button>

    <script>
        document.getElementById('pay-btn').addEventListener('click', async function () {
            const payBtn = document.getElementById('pay-btn');
            payBtn.disabled = true;  // Disable button to prevent multiple clicks

            try {
                // Fetch order details from backend
                const response = await fetch("http://localhost:3000/api/subscription/create-order", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });

                if (!response.ok) {
                    throw new Error("Failed to create order");
                }

                const order = await response.json();

                const rzp = new Razorpay({
                    key: order.razorpayKey, // Get key dynamically from backend
                    amount: order.amount,
                    currency: "INR",
                    order_id: order.id,
                    name: "TKS Freelance",
                    description: "Test Transaction",
                    prefill: {
                        name: "John Doe",
                        email: "johndoe@example.com",
                        contact: "9999999999"
                    },
                    handler: async function (response) {
                        alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);

                        // Verify payment on backend
                        const verifyResponse = await fetch("http://localhost:3000/api/subscription/verify-payment", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                order_id: order.id,
                                payment_id: response.razorpay_payment_id,
                                signature: response.razorpay_signature
                            })
                        });

                        const verifyResult = await verifyResponse.json();
                        if (verifyResult.success) {
                            alert("Payment verified successfully!");
                        } else {
                            alert("Payment verification failed.");
                        }
                    },
                    theme: { color: "#3399cc" },
                    modal: {
                        ondismiss: function () {
                            alert("Payment Cancelled");
                        }
                    }
                });

                rzp.open();
            } catch (error) {
                console.error("Payment Error:", error);
                alert("Something went wrong. Please try again.");
            } finally {
                payBtn.disabled = false;  // Re-enable button after operation
            }
        });
    </script>

</body>

</html>
